<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento del Embarazo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdf6ee;
    --blush: #e8c4b8;
    --rose: #c4775a;
    --deep: #3a2a24;
    --muted: #8a6a60;
    --accent: #7a9e7e;
    --light-rose: #f2ddd5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Mono', monospace;
    color: var(--deep);
    padding: 2rem;
    background-image: radial-gradient(ellipse at 20% 20%, #f5e6dc 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 80%, #dde8dd 0%, transparent 60%);
  }

  .card {
    background: white;
    border-radius: 2px;
    max-width: 480px;
    width: 100%;
    padding: 3rem 2.5rem;
    box-shadow: 8px 8px 0 var(--blush), 16px 16px 0 #e8d5cc30;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '♡';
    position: absolute;
    top: -20px;
    right: -10px;
    font-size: 120px;
    color: var(--light-rose);
    line-height: 1;
    pointer-events: none;
  }

  .label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }

  .date-display {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--rose);
    margin-bottom: 2.5rem;
    font-style: italic;
  }

  .week-big {
    font-family: 'Playfair Display', serif;
    font-size: 5rem;
    font-weight: 700;
    color: var(--deep);
    line-height: 1;
    letter-spacing: -2px;
  }

  .week-unit {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 0.2rem;
  }

  .days-line {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: var(--rose);
    margin-top: 0.5rem;
    font-style: italic;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--light-rose);
    margin: 2rem 0;
  }

  .progress-section { margin-bottom: 1.5rem; }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.6rem;
  }

  .progress-bar {
    height: 6px;
    background: var(--light-rose);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blush), var(--rose));
    border-radius: 3px;
    transition: width 1s ease;
  }

  .trimester-row {
    display: flex;
    gap: 0.5rem;
    margin-top: 1.5rem;
  }

  .trimester-pill {
    flex: 1;
    text-align: center;
    padding: 0.5rem 0.3rem;
    border-radius: 2px;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: 1px solid var(--light-rose);
    color: var(--muted);
  }

  .trimester-pill.active {
    background: var(--rose);
    color: white;
    border-color: var(--rose);
  }

  .trimester-pill.done {
    background: var(--light-rose);
    color: var(--rose);
    border-color: var(--blush);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-top: 1.5rem;
  }

  .stat-box {
    padding: 1rem;
    background: var(--cream);
    border-radius: 2px;
    border-left: 3px solid var(--blush);
  }

  .stat-number {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--deep);
  }

  .stat-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-top: 0.2rem;
  }

  .fpp-section {
    margin-top: 1.5rem;
    padding: 1.2rem 1.5rem;
    background: linear-gradient(135deg, var(--accent)15, #dde8dd);
    border-radius: 2px;
    border: 1px solid #b5ccb8;
  }

  .fpp-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--accent);
    margin-bottom: 0.3rem;
  }

  .fpp-date {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: var(--deep);
    font-weight: 700;
  }

  .fpp-sub {
    font-size: 0.65rem;
    color: var(--muted);
    margin-top: 0.3rem;
  }

  .mensaje {
    margin-top: 1.5rem;
    font-size: 0.75rem;
    color: var(--muted);
    font-style: italic;
    text-align: center;
    line-height: 1.6;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card { animation: fadeIn 0.6s ease forwards; }
</style>
</head>
<body>
<div class="card">
  <div class="label">Seguimiento del embarazo</div>
  <div class="date-display" id="fechaHoy"></div>

  <div class="week-big" id="semanas">—</div>
  <div class="week-unit">semanas</div>
  <div class="days-line" id="diasExtra"></div>

  <hr class="divider">

  <div class="progress-section">
    <div class="progress-label">
      <span>Progreso</span>
      <span id="porcentaje">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <div class="trimester-row">
    <div class="trimester-pill" id="t1">1.er trimestre</div>
    <div class="trimester-pill" id="t2">2.o trimestre</div>
    <div class="trimester-pill" id="t3">3.er trimestre</div>
  </div>

  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-number" id="diasTotal">—</div>
      <div class="stat-label">Días transcurridos</div>
    </div>
    <div class="stat-box">
      <div class="stat-number" id="diasRestantes">—</div>
      <div class="stat-label">Días restantes</div>
    </div>
  </div>

  <div class="fpp-section">
    <div class="fpp-label">Fecha probable de parto</div>
    <div class="fpp-date" id="fppDate">—</div>
    <div class="fpp-sub">Semana 40 · Término esperado</div>
  </div>

  <div class="mensaje" id="mensaje"></div>
</div>

<script>
  // Fecha de referencia: 18 mayo 2026 = 8 semanas y 2 días
  const refDate = new Date('2026-05-18');
  const refDias = 8 * 7 + 2; // 58 días de embarazo

  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  function formatDate(d) {
    return `${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
  }

  function calcular() {
    const hoy = new Date();
    hoy.setHours(0,0,0,0);
    refDate.setHours(0,0,0,0);

    const diffMs = hoy - refDate;
    const diffDias = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    const totalDias = refDias + diffDias;

    const semanas = Math.floor(totalDias / 7);
    const diasExtra = totalDias % 7;

    // Fecha probable de parto: semana 40 = 280 días desde inicio
    const inicioEmbarazo = new Date(refDate);
    inicioEmbarazo.setDate(inicioEmbarazo.getDate() - refDias);
    const fpp = new Date(inicioEmbarazo);
    fpp.setDate(fpp.getDate() + 280);

    const diasRestantes = Math.max(0, Math.floor((fpp - hoy) / (1000 * 60 * 60 * 24)));
    const pct = Math.min(100, Math.round((totalDias / 280) * 100));

    // UI
    document.getElementById('fechaHoy').textContent = formatDate(hoy);
    document.getElementById('semanas').textContent = semanas;
    document.getElementById('diasExtra').textContent = `y ${diasExtra} día${diasExtra !== 1 ? 's' : ''}`;
    document.getElementById('porcentaje').textContent = pct + '%';
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('diasTotal').textContent = totalDias;
    document.getElementById('diasRestantes').textContent = diasRestantes;
    document.getElementById('fppDate').textContent = formatDate(fpp);

    // Trimestres
    const t1 = document.getElementById('t1');
    const t2 = document.getElementById('t2');
    const t3 = document.getElementById('t3');
    if (semanas < 13) { t1.className = 'trimester-pill active'; t2.className = 'trimester-pill'; t3.className = 'trimester-pill'; }
    else if (semanas < 27) { t1.className = 'trimester-pill done'; t2.className = 'trimester-pill active'; t3.className = 'trimester-pill'; }
    else { t1.className = 'trimester-pill done'; t2.className = 'trimester-pill done'; t3.className = 'trimester-pill active'; }

    // Mensaje
    const mensajes = {
      1: "El corazón comienza a latir. ¡Todo empieza!",
      2: "Las primeras semanas son las más importantes. Cuídate.",
      3: "Ya se forman los órganos principales.",
      4: "¡Primer mes completado! El embrión mide unos 5mm.",
      5: "El corazón late unas 160 veces por minuto.",
      6: "Comienzan a formarse los rasgos faciales.",
      7: "El bebé mide ya unos 13mm.",
      8: "Los dedos de manos y pies se van separando.",
      9: "¡Ya es técnicamente un feto! Mide unos 3cm.",
      10: "El bebé puede doblar los codos.",
      11: "Ya tiene todos los órganos esenciales formados.",
      12: "¡Fin del primer trimestre! El riesgo de aborto disminuye.",
      13: "Segundo trimestre — la etapa del bienestar.",
      16: "Posiblemente puedas sentir los primeros movimientos.",
      20: "¡Mitad del camino! La ecografía morfológica revela el sexo.",
      24: "El bebé ya puede oír tu voz.",
      28: "Tercer trimestre — recta final.",
      32: "El bebé ocupa casi todo el espacio.",
      36: "Ya está casi listo. ¡Preparad la maleta!",
      38: "A término — puede nacer en cualquier momento.",
      40: "¡Fecha probable! El bebé está completamente listo.",
    };

    let msg = '';
    const keys = Object.keys(mensajes).map(Number).sort((a,b)=>b-a);
    for (const k of keys) { if (semanas >= k) { msg = mensajes[k]; break; } }
    document.getElementById('mensaje').textContent = msg;
  }

  calcular();
</script>
</body>
</html>
